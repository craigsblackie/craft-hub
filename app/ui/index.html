<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CraftHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5efc'/%3E%3Cpath d='M9 22V10l7 4 7-4v12l-7-4z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0d14;--panel:#141824;--panel2:#1b2030;--line:#262c40;--text:#e8ebf5;--mute:#8d95b0;--accent:#7c6cff;--accent2:#35d0ff;--ok:#3ddc97;--warn:#ffb454;--bad:#ff6b7a;--shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-theme=light]{--bg:#f3f5fb;--panel:#fff;--panel2:#f0f2f9;--line:#e0e4f0;--text:#171b2b;--mute:#6a7390;--shadow:0 10px 30px rgba(30,40,90,.1)}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 60px}
header{display:flex;align-items:center;gap:14px;padding:22px 0 8px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
h1{font-size:22px;margin:0;letter-spacing:-.02em}.sub{color:var(--mute);font-size:13px}
.spacer{flex:1}
button,.btn{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:linear-gradient(135deg,var(--accent),#5b8cff);border-color:transparent;color:#fff;font-weight:600}
.danger:hover{border-color:var(--bad);color:var(--bad)}
.icon{padding:8px 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{font-size:24px;display:block;letter-spacing:-.02em}.stat span{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;gap:10px;align-items:center;margin:18px 0 14px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 14px;font:inherit}
input[type=search]:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:6px}.chip{padding:6px 12px;border-radius:99px;font-size:13px}.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.top{display:flex;gap:14px;align-items:center}
.ava{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff;flex:none;text-transform:uppercase}
.name{font-weight:650;font-size:17px;text-transform:capitalize}.rep{color:var(--mute);font-size:12.5px}
.desc{color:var(--mute);font-size:13.5px;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--mute)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}.pill.bad{color:var(--bad)}
.actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}.actions .primary{flex:1;justify-content:center}
.prog{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.jobmsg{font-size:12.5px;color:var(--mute)}
.menu{position:relative}.pop{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:210px;box-shadow:var(--shadow);z-index:5;display:none}
.pop.open{display:block}.pop button{width:100%;border:0;background:none;justify-content:flex-start;border-radius:8px}.pop button:hover{background:var(--panel)}
.pop label{display:flex;gap:8px;align-items:center;padding:8px 14px;font-size:14px;cursor:pointer}
.pop select{width:calc(100% - 12px);margin:4px 6px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:460px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(5,7,12,.6);backdrop-filter:blur(4px)}
dialog h3{margin:0 0 8px}dialog p{color:var(--mute);margin:0 0 18px}.row{display:flex;gap:8px;justify-content:flex-end}
.logline{font:12.5px ui-monospace,monospace;padding:6px 0;border-bottom:1px solid var(--line);color:var(--mute)}.logline.error{color:var(--bad)}.logline time{color:var(--text);margin-right:8px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);animation:in .2s}.toast.error{border-left-color:var(--bad)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
select#sort,.pop select,dialog input[type=number]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
#problems .warnbox{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:13.5px}
.sw{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.spacer{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><svg width="22" height="22" viewBox="0 0 32 32"><path d="M7 23V9l9 5 9-5v14l-9-5z" fill="#fff"/></svg></div>
  <div><h1>CraftHub</h1><div class="sub" id="checked">Loading…</div></div>
  <div class="spacer"></div>
  <label class="sw"><input type="checkbox" id="autoall"> Auto-update all</label>
  <button id="btnlog" class="icon" title="Activity log">📜</button>
  <button id="btnset" class="icon" title="Settings">⚙</button>
  <button id="btntheme" class="icon" title="Toggle theme">🌓</button>
  <button id="btncheck">↻ Check for updates</button>
  <button id="btnupall" class="primary" hidden>⬆ Update all</button>
</header>
<div id="problems"></div>
<div class="stats" id="stats"></div>
<div class="bar">
  <input type="search" id="q" placeholder="Search apps…">
  <div class="chips" id="chips"></div>
  <select id="sort" title="Sort"><option value="name">Sort: name</option><option value="updated">Sort: recently released</option><option value="size">Sort: size on disk</option></select>
  <button id="btninstall" title="Install every app not yet installed">＋ Install all</button>
</div>
<div class="grid" id="grid"></div>
</div>
<dialog id="dlg"><h3 id="dt"></h3><p id="dp"></p><div class="row"><button id="dno">Cancel</button><button id="dyes" class="primary"></button></div></dialog>
<dialog id="logdlg"><h3>Activity</h3><div id="logbox" style="max-height:60vh;overflow:auto"></div><div class="row" style="margin-top:14px"><button id="logclose">Close</button></div></dialog>
<dialog id="setdlg"><h3>Settings</h3>
  <p>Check for updates every <input type="number" id="hours" min="0.25" step="0.25" style="width:80px"> hours.<br><span id="notifystate"></span></p>
  <div class="row" style="justify-content:flex-start;margin-bottom:18px"><button id="btnexport">⇩ Export installed list</button><button id="btnimport">⇧ Import &amp; install</button><input type="file" id="importfile" accept="application/json" hidden></div>
  <div class="row"><button id="setclose">Close</button><button class="primary" id="saveset">Save</button></div></dialog>
<div id="toasts"></div>
<script src="ui/app.js"></script>
</body>
</html>
